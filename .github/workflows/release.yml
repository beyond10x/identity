name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      source-commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the provider-reported default branch tip
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          default_branch=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)
          default_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${default_branch}" --jq .sha)
          tag_sha=$(git rev-parse "${GITHUB_REF_NAME}^{commit}")
          test -n "$default_branch"
          test "$tag_sha" = "$default_sha"
          echo "commit=${tag_sha}" >> "$GITHUB_OUTPUT"
      - name: Match the workspace version
        run: |
          workspace_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test "$workspace_version" = "$GITHUB_REF_NAME"

  promote:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Organization release token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.B10X_BOT_APP_ID }}
          private-key: ${{ secrets.B10X_BOT_PRIVATE_KEY }}
          owner: beyond10x
          repositories: |
            devcenter
            identity
      - name: Delegate the private runtime promotion
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.source-commit }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh workflow run promote-identity.yml \
            --repo beyond10x/devcenter \
            --ref main \
            -f "version=${VERSION}" \
            -f "source_commit=${SOURCE_COMMIT}"

          for _ in $(seq 1 180); do
            if gh release view "$VERSION" --repo beyond10x/identity >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          echo "Identity runtime promotion did not publish release ${VERSION} within 15 minutes" >&2
          exit 1
