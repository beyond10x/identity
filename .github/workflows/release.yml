name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      source-commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the provider-reported default branch tip
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          default_branch=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)
          default_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${default_branch}" --jq .sha)
          tag_sha=$(git rev-parse "${GITHUB_REF_NAME}^{commit}")
          test -n "$default_branch"
          test "$tag_sha" = "$default_sha"
          echo "commit=${tag_sha}" >> "$GITHUB_OUTPUT"
      - name: Match the workspace version
        run: |
          workspace_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test "$workspace_version" = "$GITHUB_REF_NAME"

  image:
    needs: validate
    name: image (${{ matrix.arch }})
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE: ghcr.io/beyond10x/identity
      VERSION: ${{ github.ref_name }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.source-commit }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite a published version
        run: |
          if docker buildx imagetools inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
            echo "::error::${IMAGE}:${VERSION} already exists; a released image is never rebuilt"
            exit 1
          fi
      - name: Build and push the runtime image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=identity-release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=identity-release-${{ matrix.arch }}
          build-args: SOURCE_SHA=${{ needs.validate.outputs.source-commit }}
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}-${{ matrix.arch }}
      - name: Verify the pushed digest
        env:
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          case "$BUILT_DIGEST" in sha256:*) ;; *) echo "::error::build reported no digest"; exit 1 ;; esac
          pushed=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}-${ARCH}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          test "$pushed" = "$BUILT_DIGEST"

  image-index:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    env:
      IMAGE: ghcr.io/beyond10x/identity
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the multi-platform version tag
        id: index
        run: |
          if docker buildx imagetools inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
            echo "::error::${IMAGE}:${VERSION} already exists; a released image is never rebuilt"
            exit 1
          fi
          docker buildx imagetools create --tag "${IMAGE}:${VERSION}" \
            "${IMAGE}:${VERSION}-amd64" "${IMAGE}:${VERSION}-arm64"
          manifest=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}')
          digest=$(jq -r .digest <<<"$manifest")
          grep -Eq '^sha256:[0-9a-f]{64}$' <<<"$digest"
          for platform in linux/amd64 linux/arm64; do
            jq -e --arg p "$platform" \
              '[.manifests[] | select(.platform != null) | "\(.platform.os)/\(.platform.architecture)"] | index($p)' \
              <<<"$manifest" >/dev/null
          done
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

  publish:
    needs: [validate, image-index]
    runs-on: ubuntu-latest
    steps:
      - name: Write the release manifest
        env:
          DIGEST: ${{ needs.image-index.outputs.digest }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.source-commit }}
          VERSION: ${{ github.ref_name }}
        run: |
          if ! grep -Eq '^sha256:[0-9a-f]{64}$' <<<"$DIGEST"; then
            echo "::error::the image job reported no digest; refusing to publish a release without one"
            exit 1
          fi
          grep -Eq '^[0-9a-f]{40}$' <<<"$SOURCE_COMMIT"
          mkdir -p out
          jq --null-input \
            --arg version "$VERSION" \
            --arg commit "$SOURCE_COMMIT" \
            --arg digest "$DIGEST" \
            --arg image "ghcr.io/beyond10x/identity@${DIGEST}" \
            '{schema:1, version:$version, source_commit:$commit, image:$image, artifacts:{identity_runtime:$digest}}' \
            > out/release-manifest.json
          cat out/release-manifest.json
      - name: Organization release token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.B10X_BOT_APP_ID }}
          private-key: ${{ secrets.B10X_BOT_PRIVATE_KEY }}
          owner: beyond10x
          repositories: identity
      - name: Publish the release with its manifest as the organization bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.source-commit }}
          VERSION: ${{ github.ref_name }}
        run: |
          if gh release view "$VERSION" --repo beyond10x/identity >/dev/null 2>&1; then
            author=$(gh release view "$VERSION" --repo beyond10x/identity --json author --jq .author.login)
            if [ "$author" != "b10x-bot[bot]" ]; then
              echo "::error::release ${VERSION} exists and was published by ${author}, not b10x-bot[bot]"
              exit 1
            fi
            present=$(gh release view "$VERSION" --repo beyond10x/identity --json assets \
              --jq '[.assets[] | select(.name == "release-manifest.json")] | length')
            if [ "$present" = 0 ]; then
              gh release upload "$VERSION" out/release-manifest.json --repo beyond10x/identity
              exit 0
            fi
            mkdir -p existing
            gh release download "$VERSION" --repo beyond10x/identity -p release-manifest.json -D existing
            if ! jq -e --slurpfile new out/release-manifest.json '. == $new[0]' existing/release-manifest.json >/dev/null; then
              echo "::error::release ${VERSION} already carries a different release-manifest.json; it is never replaced"
              exit 1
            fi
            exit 0
          fi
          gh release create "$VERSION" out/release-manifest.json --repo beyond10x/identity \
            --verify-tag --target "$SOURCE_COMMIT" \
            --title "Identity ${VERSION}" --generate-notes
