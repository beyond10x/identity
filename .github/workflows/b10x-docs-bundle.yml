# Generated by `atlas docs reconcile`; edit Atlas documentation intent, not this file.
name: Documentation source bundle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/b10x-docs-bundle.yml'
      - 'README.md'
      - 'b10x.docs.yaml'
      - 'changes/**/*.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b10x-docs-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    if: github.repository == 'beyond10x/identity' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Build normalized documentation bundle
        uses: beyond10x/docs-system/.github/actions/bundle@674157e32ba53b25bd67ea1f426b71368bebcdc2
        with:
          repository-root: .
          output: ${{ runner.temp }}/b10x-docs-bundle
          commit: ${{ github.sha }}
          run-id: ${{ github.run_id }}

      - name: Upload immutable documentation bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: b10x-docs-bundle
          path: ${{ runner.temp }}/b10x-docs-bundle
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
