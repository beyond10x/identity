# Generated by `atlas docs reconcile`; edit Atlas delivery intent, not this file.
name: Documentation façade

on:
  workflow_dispatch:
    inputs:
      website_sha:
        description: Exact Website commit already live at the organization root
        required: true
        type: string

permissions: {}

concurrency:
  group: b10x-docs-pages
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.actor == 'b10x-bot[bot]'
      && github.triggering_actor == 'b10x-bot[bot]'
      && github.repository == 'beyond10x/identity'
      && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: beyond10x/website/.github/workflows/redirect-facade.yml@abf8288dc65da55c74931724f9185f46a3a2e49f
    with:
      website_sha: ${{ inputs.website_sha }}
      repository: identity
      control_sha: ${{ github.sha }}
