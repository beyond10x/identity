# Generated by `atlas docs reconcile`; edit Atlas delivery intent, not this file.
name: Documentation façade

on:
  workflow_dispatch:
    inputs:
      migration_website_sha:
        description: Optional fixed root Website commit used once to preserve stable alias bytes
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: b10x-docs-pages
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.actor == 'b10x-bot[bot]'
      && github.triggering_actor == 'b10x-bot[bot]'
      && github.repository == 'beyond10x/identity'
      && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: beyond10x/website/.github/workflows/redirect-facade.yml@98f14dd2dc8bed13932b2ba72d5a8138f11ea309
    with:
      repository: identity
      control_sha: ${{ github.sha }}
      canonical_route: /docs/identity/
      profile_route: /ecosystem/identity/
      migration_website_sha: ${{ inputs.migration_website_sha || '' }}
