# Generated by `atlas docs reconcile`; edit Atlas documentation intent, not this file.
name: Documentation source check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: b10x-docs-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  b10x-docs-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Check declared documentation sources
        uses: beyond10x/docs-system/.github/actions/check@339b4b8462f19b4c9d3716e6a44ed2a3691eb9d8
        with:
          repository-root: .
