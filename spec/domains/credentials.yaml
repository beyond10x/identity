domain: identity.credentials

summary: >-
  The credentials Identity issues and resolves: the opaque CLI session and the five-minute
  audience-scoped relying-party access token. Both are stored only as SHA-256 verifiers of the
  bearer value (AGENTS.md invariant 2); both prefixes are opaque on the wire (decision 0003).

naming:
  wire: credentials
  display: Credentials

types:
  - name: identity.credentials.SessionVerifier
    naming:
      summary: >-
        The SHA-256 verifier of a session value; Identity stores it and never the value
        (AGENTS.md invariant 2; hash() src/lib.rs:3597-3599, 1662; column verifier_hash BLOB
        src/lib.rs:1133).
    kind: newtype
    of: Bytes

  - name: identity.credentials.AccessTokenVerifier
    naming:
      summary: >-
        The SHA-256 verifier of an access-token value; Identity stores it and never the value
        (AGENTS.md invariant 2; src/lib.rs:1796; column verifier_hash BLOB src/lib.rs:1146).
    kind: newtype
    of: Bytes

entities:
  - name: identity.credentials.Session
    # read from: table sessions src/lib.rs:1132-1144 and src/lib.rs:1191-1202; put_session
    # src/lib.rs:1654-1712; resolve_session src/lib.rs:1714-1789.
    naming:
      summary: >-
        An opaque `identity_session_v1_` session (src/lib.rs:3394-3397) bound to the exact issuer,
        tenant and configuration generation (AGENTS.md invariant 6). Idle lifetime 24 h, absolute
        30 days (src/lib.rs:68-69).
    identity:
      name: verifier_hash
      type: identity.credentials.SessionVerifier
    fields:
      - name: issuer                     # src/lib.rs:1134
        type: String
      - name: configuration_generation   # Config::configuration_generation src/lib.rs:145-207
        type: String
      - name: tenant_id                  # src/lib.rs:1136
        type: String
      - name: subject                    # src/lib.rs:1137
        type: String
      - name: email                      # src/lib.rs:1138
        type: Optional<String>
      - name: created_at                 # unix seconds, src/lib.rs:1139
        type: Integer
      - name: last_used_at               # src/lib.rs:1140
        type: Integer
      - name: idle_expires_at            # src/lib.rs:1141
        type: Integer
      - name: absolute_expires_at        # src/lib.rs:1142
        type: Integer
      - name: revoked_at                 # src/lib.rs:1143
        type: Optional<Integer>
    invariants:
      # resolve_session keeps idle_expires_at at most absolute_expires_at (min/LEAST
      # src/lib.rs:1729, 1763); put_session starts it at now + 24 h, below now + 30 d
      # (src/lib.rs:1663-1664).
      - idle_expires_at <= absolute_expires_at
    # UNMAPPED: idle_expires_at = now + 86400 and absolute_expires_at = now + 2592000 at insert
    # (src/lib.rs:1663-1664), and every session-authenticated request rewrites last_used_at = now
    # and idle_expires_at = min(now + 86400, absolute_expires_at) (src/lib.rs:1726-1740). `now` is
    # not a value in `sets:`, and the rewrite happens on reads (session authority, profile and
    # directory reads), which ESS views cannot change.
    # UNMAPPED: a session resolves only while issuer and configuration_generation equal the
    # running configuration's and both expiries are in the future (src/lib.rs:1731-1736). The
    # configuration is not modelled and the expiries are Integer unix seconds, not Timestamps.
    lifecycle:
      # Read from revoked_at: NULL is Active, set is Revoked (src/lib.rs:1735, 1917-1920). Expiry is
      # not a stored state; expired and revoked rows are deleted by the next credential insert
      # (src/lib.rs:1993-1997), which no command declares.
      initial: Active
      states:
        - {name: Active, summary: 'revoked_at IS NULL (src/lib.rs:1735).'}
        - {name: Revoked, summary: 'revoked_at is set by logout (src/lib.rs:1917-1920).'}
      terminal: [Revoked]
      transitions:
        - {name: revoke, from: [Active], to: Revoked, summary: 'POST /v1/logout (src/lib.rs:2836-2859).'}

  - name: identity.credentials.AccessToken
    # read from: table access_tokens src/lib.rs:1145-1161 and src/lib.rs:1203-1209; struct
    # AccessAuthority src/lib.rs:2331-2345; mint_access_token src/lib.rs:2729-2787.
    naming:
      summary: >-
        A five-minute `identity_access_v1_` token for exactly one registered audience
        (src/lib.rs:70, 2742-2745; README.md "Audiences"). Its authority document is what a
        relying party resolves.
    identity:
      name: verifier_hash
      type: identity.credentials.AccessTokenVerifier
    fields:
      - name: issuer                     # iss, src/lib.rs:1147, 2747-2752
        type: String
      - name: sub                        # column subject, wire sub, src/lib.rs:1148, 2333
        type: String
      - name: audience                   # aud, src/lib.rs:1149
        type: String
      - name: issued_at                  # iat, unix seconds, src/lib.rs:1150
        type: Integer
      - name: not_before                 # nbf, src/lib.rs:1151
        type: Integer
      - name: expires_at                 # exp, src/lib.rs:1152
        type: Integer
      - name: token_id                   # jti, "identity_jti_v1_" + 16 random bytes, src/lib.rs:1153, 2759-2762
        type: String
      - name: actor_subject              # act.sub, src/lib.rs:1154, 2763
        type: String
      - name: scope                      # src/lib.rs:1155
        type: String
      - name: principal_kind             # always "human" when minted, src/lib.rs:1156, 2765
        type: String
      - name: tenant_id                  # src/lib.rs:1157
        type: String
      - name: email                      # src/lib.rs:1158
        type: Optional<String>
      - name: groups                     # space-joined TEXT, src/lib.rs:1159, 1797, 2131-2136
        type: List<String>
      - name: revoked_at                 # src/lib.rs:1160
        type: Optional<Integer>
    invariants:
      # Every mint path sets act.sub to the subject and principal_kind to "human"
      # (mint_access_token src/lib.rs:2754-2765, the only writer of the table).
      - actor_subject == sub
      - principal_kind == "human"
      # nbf = iat (src/lib.rs:2756-2757) and exp = iat + 300 (src/lib.rs:2758).
      - not_before == issued_at
      - expires_at == issued_at + 300
    # UNMAPPED: issued_at = now (src/lib.rs:2741); `now` is not a value in `sets:`.
    # UNMAPPED: groups are the deployment's static and tenant-default groups for (tenant_id,
    # email) at mint time (StaticGroupMemberships::groups_for src/lib.rs:626-645,
    # src/lib.rs:2736-2739); deployment configuration is not modelled.
    lifecycle:
      # Read from revoked_at, as for Session (src/lib.rs:1869, 1922-1925).
      initial: Active
      states:
        - {name: Active, summary: 'revoked_at IS NULL (src/lib.rs:1869).'}
        - {name: Revoked, summary: 'revoked_at set by logout for the subject (src/lib.rs:1922-1925).'}
      terminal: [Revoked]
      transitions:
        - {name: revoke, from: [Active], to: Revoked, summary: 'POST /v1/logout revokes every token of the subject.'}

actors:
  - name: identity.credentials.PublicClient
    # A public PKCE client: the CLI (cli_client_id, default "identity-cli", src/main.rs:89-90) or a
    # registered web client (src/lib.rs:326-368). It authenticates with no secret
    # (token_endpoint_auth_methods_supported ["none"], src/lib.rs:2617).
    naming:
      display: Public PKCE client (CLI user)
    may:
      - identity.credentials.ExchangeAuthorizationCode

  - name: identity.credentials.SessionHolder
    # The CLI user holding an Identity session in the Authorization bearer
    # (bearer(valid_session_credential) src/lib.rs:2628-2629, 2841-2842). Attributes as for
    # identity.login.SessionAudienceApplication. Decision D2.
    naming:
      display: CLI user with a session
    attributes:
      - {name: tenant_id, type: String}
      - {name: subject, type: String}
    may:
      - identity.credentials.IssueAccessToken
      - identity.credentials.Logout

  - name: identity.credentials.TrustedAccessCaller
    # A confidential service admitted by IDENTITY_TRUSTED_ACCESS_CALLERS_JSON (src/main.rs:112-140;
    # README.md lines 113-127).
    naming:
      display: Trusted access-exchange caller
    may:
      - identity.credentials.ExchangeAccessToken

  - name: identity.credentials.RelyingParty
    # A relying party resolving an access token for its exact registered audience
    # (verify_access_token src/lib.rs:2812-2834; README.md "Audiences").
    naming:
      display: Relying party
    may:
      - identity.credentials.AccessAuthority

events:
  # Not published by Identity; see identity.login events and decision D4.
  - name: identity.credentials.SessionIssued
    fields:
      - {name: verifier_hash, type: identity.credentials.SessionVerifier}

  - name: identity.credentials.AccessTokenIssued
    fields:
      - {name: verifier_hash, type: identity.credentials.AccessTokenVerifier}
      - {name: audience, type: String}

  - name: identity.credentials.SessionRevoked
    fields:
      - {name: verifier_hash, type: identity.credentials.SessionVerifier}

commands:
  - name: identity.credentials.ExchangeAuthorizationCode
    # POST /oauth/token (form body), exchange_token() src/lib.rs:3341-3418; TokenRequest
    # src/lib.rs:2233-2243.
    naming:
      wire: token
      display: Exchange the authorization code
      summary: >-
        Exchanges the one-use code under its exact client, redirect and PKCE verifier binding. A
        code bound to a resource yields the five-minute access token for that audience; any other
        yields an Identity session (README.md lines 214-218).
    input:
      - {name: grant_type, type: String}
      - {name: client_id, type: String}
      - name: code_hash
        type: identity.login.CodeVerifier
        summary: >-
          The SHA-256 verifier of the posted `code` (take_code hashes it, src/lib.rs:1601). The
          wire carries the code value; the model names the record by its verifier, because ESS
          admits neither `sha256(input.code)` as an instance nor a function in a selector
          (validate: ESS-COMMAND-009). Decision D5.
      - {name: redirect_uri, type: String}
      - {name: code_verifier, type: String}
      - {name: resource, type: Optional<String>}
      - {name: scope, type: Optional<String>}
    response:
      # SessionResponse src/lib.rs:2270-2278, answered by the session branch with no-store
      # (confidential_json src/lib.rs:3420-3429).
      - {name: session, type: String}
      - {name: session_type, type: String}     # always "opaque_server_session", src/lib.rs:3412
      - {name: expires_in, type: Integer}      # SESSION_IDLE_SECONDS = 86400, src/lib.rs:3413
      - {name: tenant_id, type: String}
      - {name: subject, type: String}
      - {name: email, type: Optional<String>}
    # UNMAPPED: take_code deletes the code row (DELETE ... RETURNING src/lib.rs:1600-1611) before
    # the binding checks (src/lib.rs:3356-3363), so the code is consumed on success and on every
    # refusal after the lookup (AGENTS.md invariant 5). An outcome has one subject and the
    # creating outcomes keep the session or token they create. What would settle it: a second
    # effect beside `creates:`, or `deletes:` on a refusal.
    # UNMAPPED: the code is refused when older than 60 s, `now - created_at > 60`
    # (CODE_LIFETIME_SECONDS src/lib.rs:67, 3357); created_at is Integer unix seconds.
    # UNMAPPED: the resource branch answers AccessTokenResponse (src/lib.rs:2315-2321), not the
    # response declared here; ESS declares one response per command.
    outcomes:
      - name: bad-grant-type
        when: grant_type != "authorization_code"
        error: identity.errors.InvalidRequest
        summary: '"grant_type must be authorization_code" (src/lib.rs:3345-3347).'

      - name: bad-verifier
        when: {any: [code_verifier.count < 43, code_verifier.count > 128]}
        error: identity.errors.InvalidRequest
        summary: >-
          '"invalid PKCE code_verifier": 43-128 characters of [A-Za-z0-9-._~]
          (valid_pkce_verifier src/lib.rs:3515-3519). UNMAPPED: the character class is not
          declared.'

      - name: unknown-code
        when_related: {via: input.code_hash, exists: false}
        error: identity.errors.AccessDenied
        summary: '"unknown or already-used authorization code" (src/lib.rs:3351-3355).'

      - name: binding-failed
        when_related:
          via: input.code_hash
          predicate:
            any:
              - client_id != input.client_id
              - redirect_uri != input.redirect_uri
              - code_challenge != base64url(sha256(ascii(input.code_verifier)))
        error: identity.errors.AccessDenied
        summary: '"authorization code binding failed" (src/lib.rs:3356-3363; pkce_challenge src/lib.rs:3586-3588).'

      - name: resource-binding-failed
        when_related:
          via: input.code_hash
          predicate:
            all:
              - defined(requested_audience)
              - requested_audience != input.resource
        error: identity.errors.AccessDenied
        summary: >-
          '"authorization resource binding failed": a resource-bound code needs the same
          resource (src/lib.rs:3364-3367). UNMAPPED: an absent input.resource is refused there as
          well; a comparison with an absent value is unknown in ESS, so that case is not
          declared.'

      - name: resource-not-bound
        when: defined(resource)
        when_related: {via: input.code_hash, predicate: not defined(requested_audience)}
        error: identity.errors.AccessDenied
        summary: '"authorization resource binding failed": a session code with a resource (src/lib.rs:3390-3392).'

      - name: scope-binding-failed
        when: defined(scope)
        when_related:
          via: input.code_hash
          predicate:
            all:
              - defined(requested_audience)
              - requested_scope != input.scope
        error: identity.errors.AccessDenied
        summary: '"authorization scope binding failed" (src/lib.rs:3371-3378).'

      - name: session-capacity
        when_related:
          entity: identity.credentials.Session
          where: defined(verifier_hash)
          count: {gte: 100000}
        error: identity.errors.ServerError
        summary: >-
          MAX_SESSIONS = 100 000 (src/lib.rs:73), counted after collection (src/lib.rs:1661). The
          resource branch is held to MAX_ACCESS_TOKENS instead; UNMAPPED: a cap scoped to one
          accepting branch is not declared.

      - name: audience-or-scope-not-admitted
        external: >-
          on the resource branch, mint_access_token refuses an audience the registry no longer
          admits or a scope the subject's groups do not admit (src/lib.rs:2736-2740, 419-439)
        error: identity.errors.AccessDenied

      - name: access-token
        when_related: {via: input.code_hash, predicate: defined(requested_audience)}
        creates: identity.credentials.AccessToken
        instance: verifier_hash
        sets:
          sub: {related: {via: input.code_hash, field: subject}}
          actor_subject: {related: {via: input.code_hash, field: subject}}
          tenant_id: {related: {via: input.code_hash, field: tenant_id}}
          email: {related: {via: input.code_hash, field: email}}
          principal_kind: "human"
          issuer: {generated: true}
          audience: {generated: true}
          issued_at: {generated: true}
          not_before: {generated: true}
          expires_at: {generated: true}
          token_id: {generated: true}
          scope: {generated: true}
          groups: {generated: true}
          revoked_at: {cleared: true}
        emits: [identity.credentials.AccessTokenIssued]
        payload:
          identity.credentials.AccessTokenIssued: {verifier_hash: {generated: true}, audience: {generated: true}}
        summary: >-
          A resource-bound code mints the access token for its audience and scope
          (src/lib.rs:3379-3387). UNMAPPED: audience and scope are the code row's
          requested_audience and requested_scope, both Optional there and required here
          (src/lib.rs:3368-3370); ESS does not narrow a related Optional on this branch.

      - name: session
        creates: identity.credentials.Session
        instance: verifier_hash
        returns: true
        one_time_response: [session]
        sets:
          tenant_id: {related: {via: input.code_hash, field: tenant_id}}
          subject: {related: {via: input.code_hash, field: subject}}
          email: {related: {via: input.code_hash, field: email}}
          issuer: {generated: true}
          configuration_generation: {generated: true}
          created_at: {generated: true}
          last_used_at: {generated: true}
          idle_expires_at: {generated: true}
          absolute_expires_at: {generated: true}
          revoked_at: {cleared: true}
        emits: [identity.credentials.SessionIssued]
        payload:
          identity.credentials.SessionIssued: {verifier_hash: {generated: true}}
        summary: >-
          Mints the opaque session for the code's tenant, subject and email, stores its verifier
          and answers it once with no-store (src/lib.rs:3394-3417).

  - name: identity.credentials.IssueAccessToken
    # POST /v1/access-token, issue_access_token() src/lib.rs:2623-2646; AccessTokenRequest
    # src/lib.rs:2299-2305 (deny_unknown_fields).
    naming:
      wire: access-token
      display: Issue an access token
      summary: >-
        From a live session, mints a five-minute access token for one registered audience and a
        scope set the registry admits for the subject (src/lib.rs:2729-2787).
    input:
      - {name: audience, type: String}
      - {name: scope, type: String}
    response:
      # AccessTokenResponse src/lib.rs:2315-2321, no-store.
      - {name: access_token, type: String}
      - {name: token_type, type: String}       # always "Bearer", src/lib.rs:2782
      - {name: expires_in, type: Integer}      # always 300, src/lib.rs:2783
      - {name: audience, type: String}
      - {name: scope, type: String}
    # UNMAPPED: the scope must be canonical (src/lib.rs:3559-3577), and the stored and answered
    # scope is the admitted set sorted and space-joined (AccessAudiencePolicy::admit
    # src/lib.rs:419-439), which differs from the request when it was not sorted. ESS has no
    # sort for a space-separated string, so `scope` is left generated.
    outcomes:
      - name: token-capacity
        when_related:
          entity: identity.credentials.AccessToken
          where: defined(verifier_hash)
          count: {gte: 100000}
        error: identity.errors.ServerError
        summary: MAX_ACCESS_TOKENS = 100 000 (src/lib.rs:74), put_access_token (src/lib.rs:1791-1796).

      - name: audience-not-admitted
        external: 'the audience is not a registered access audience (src/lib.rs:2736-2740)'
        error: identity.errors.AccessDenied

      - name: scope-not-admitted
        external: >-
          the scope set is malformed (400, src/lib.rs:3559-3577) or names a scope neither the
          audience's base scopes nor the subject's static groups admit (401,
          src/lib.rs:419-439)
        error: identity.errors.AccessDenied

      - name: issued
        creates: identity.credentials.AccessToken
        instance: verifier_hash
        returns: true
        one_time_response: [access_token]
        sets:
          audience: input.audience
          sub: {caller: subject}
          actor_subject: {caller: subject}
          tenant_id: {caller: tenant_id}
          principal_kind: "human"
          issuer: {generated: true}
          issued_at: {generated: true}
          not_before: {generated: true}
          expires_at: {generated: true}
          token_id: {generated: true}
          scope: {generated: true}
          email: {generated: true}
          groups: {generated: true}
          revoked_at: {cleared: true}
        emits: [identity.credentials.AccessTokenIssued]
        payload:
          identity.credentials.AccessTokenIssued: {verifier_hash: {generated: true}, audience: input.audience}
        summary: 'Stored and answered with no-store (src/lib.rs:2741-2786).'

  - name: identity.credentials.ExchangeAccessToken
    # POST /v1/access-exchange, exchange_access_token() src/lib.rs:2648-2727; AccessExchangeRequest
    # src/lib.rs:2306-2313; README.md lines 113-127.
    naming:
      wire: access-exchange
      display: Exchange an access token
      summary: >-
        A confidential caller narrows one live human access token into an exact
        deployment-admitted target audience and scope set, recomputing the subject's current
        groups, and receives the ordinary five-minute target token.
    input:
      - {name: source_audience, type: String}
      - {name: audience, type: String}
      - {name: scope, type: String}
    response:
      - {name: access_token, type: String}
      - {name: token_type, type: String}
      - {name: expires_in, type: Integer}
      - {name: audience, type: String}
      - {name: scope, type: String}
    # UNMAPPED: the source token arrives in the Authorization bearer and the caller in the
    # x-b10x-access-exchange-* headers; neither is an input, so the checks that read the source
    # token row (principal_kind "human", act.sub == sub, required source scopes,
    # src/lib.rs:2707-2717) are declared as external refusals.
    outcomes:
      - name: token-capacity
        when_related:
          entity: identity.credentials.AccessToken
          where: defined(verifier_hash)
          count: {gte: 100000}
        error: identity.errors.ServerError
        summary: MAX_ACCESS_TOKENS = 100 000 (src/lib.rs:74).

      - name: caller-refused
        external: >-
          the caller id or secret header is missing, names no trusted caller, or the secret does
          not match in constant time (src/lib.rs:2653-2667, 3601-3611)
        error: identity.errors.AccessDenied

      - name: exchange-not-admitted
        external: >-
          no exchange policy binds this caller, source audience, target audience and every
          requested target scope (src/lib.rs:2669-2681)
        error: identity.errors.Forbidden

      - name: audiences-not-registered
        external: 'the source or target audience is not a registered access audience (src/lib.rs:2682-2697)'
        error: identity.errors.Forbidden

      - name: source-token-refused
        external: >-
          the bearer is not an access credential, or names no live token for source_audience
          (src/lib.rs:2698-2705)
        error: identity.errors.AccessDenied

      - name: source-authority-refused
        external: >-
          the source token is not a human self-actor or lacks a required source scope
          (src/lib.rs:2706-2717)
        error: identity.errors.Forbidden

      - name: target-scope-not-admitted
        external: 'the target audience policy does not admit the scope for the subject (src/lib.rs:2736-2740)'
        error: identity.errors.AccessDenied

      - name: exchanged
        creates: identity.credentials.AccessToken
        instance: verifier_hash
        returns: true
        one_time_response: [access_token]
        sets:
          audience: input.audience
          principal_kind: "human"
          sub: {generated: true}
          actor_subject: {generated: true}
          tenant_id: {generated: true}
          email: {generated: true}
          issuer: {generated: true}
          issued_at: {generated: true}
          not_before: {generated: true}
          expires_at: {generated: true}
          token_id: {generated: true}
          scope: {generated: true}
          groups: {generated: true}
          revoked_at: {cleared: true}
        emits: [identity.credentials.AccessTokenIssued]
        payload:
          identity.credentials.AccessTokenIssued: {verifier_hash: {generated: true}, audience: input.audience}
        summary: 'Subject, tenant and email are the source token''s (src/lib.rs:2718-2726); UNMAPPED, read from the bearer.'

  - name: identity.credentials.Logout
    # POST /v1/logout, logout() src/lib.rs:2836-2859; revoke_session_and_subject_tokens
    # src/lib.rs:1909-1951.
    naming:
      wire: logout
      display: Log out
      summary: >-
        Revokes the presented session and every outstanding access token of its subject
        (AGENTS.md "Revocation is total"). Answers 204.
    input:
      - name: session_verifier
        type: identity.credentials.SessionVerifier
        summary: >-
          The SHA-256 verifier of the Authorization bearer (hash(credential) src/lib.rs:1915). The
          wire carries the session value; the model names the record by its verifier. Decision D5.
    # Disagreement D-1: the token revocation selects `WHERE subject = ?1` (src/lib.rs:1922-1925,
    # 1936-1941) with no tenant_id, while AGENTS.md invariant 4 makes (tenant, subject) the user
    # key. A subject present in two tenants loses the other tenant's tokens too.
    outcomes:
      - name: session-gone
        unknown_instance: true
        error: identity.errors.AccessDenied
        summary: '"the Identity session is expired or revoked" (src/lib.rs:2843-2848).'

      - name: logged-out
        moves: identity.credentials.Session.revoke
        instance: session_verifier
        sets:
          revoked_at: {generated: true}
        affects:
          - entity: identity.credentials.AccessToken
            where:
              all:
                - sub == subject.subject
                - state == Active
            moves: identity.credentials.AccessToken.revoke
        emits: [identity.credentials.SessionRevoked]
        payload:
          identity.credentials.SessionRevoked: {verifier_hash: input.session_verifier}
        summary: '204 No Content (src/lib.rs:2858).'

      - name: already-revoked
        wrong_state: true
        error: identity.errors.AccessDenied
        summary: >-
          A revoked session no longer resolves, so the same 401 answers (src/lib.rs:1735,
          2843-2848, 2849-2856).

views:
  - name: identity.credentials.SessionAuthority
    # GET /v1/session-authority, session_authority() src/lib.rs:2789-2810; SessionAuthority
    # src/lib.rs:2279-2289. The audience header must be a registered session audience
    # (src/lib.rs:2793-2795). The code addresses the session by the presented bearer; a view cannot
    # read `caller`, so the bearer's verifier is a parameter. Decision D2.
    # UNMAPPED: `groups` are the deployment's static groups for (tenant_id, email)
    # (src/lib.rs:2797-2800) and `aud` echoes the header; neither is stored. The read also slides
    # the idle expiry (src/lib.rs:1726-1740).
    source: identity.credentials.Session
    consistency: read_your_writes
    params:
      - {name: session_verifier, type: identity.credentials.SessionVerifier}
    filter:
      all:
        - verifier_hash == param.session_verifier
        - state == Active
    fields:
      - {name: issuer, type: String}               # iss
      - {name: subject, type: String}              # sub
      - {name: idle_expires_at, type: Integer}     # exp, AdmittedSession::expires_at src/lib.rs:1738, 2804
      - {name: email, type: Optional<String>}
      - {name: tenant_id, type: String}
    naming:
      wire: session-authority
      display: Session authority

  - name: identity.credentials.AccessAuthority
    # GET /v1/access-authority, verify_access_token() src/lib.rs:2812-2834; query
    # src/lib.rs:1855-1907. The audience header must be a registered access audience
    # (src/lib.rs:2816-2824) and must equal the token's audience (src/lib.rs:1869).
    # UNMAPPED: `not_before <= now AND expires_at > now` (src/lib.rs:1869-1870) compares Integer
    # unix seconds with the clock; a view's `now` filter orders a Timestamp.
    source: identity.credentials.AccessToken
    consistency: read_your_writes
    params:
      - {name: token_verifier, type: identity.credentials.AccessTokenVerifier}
      - {name: audience, type: String}
    filter:
      all:
        - verifier_hash == param.token_verifier
        - audience == param.audience
        - state == Active
    fields:
      - {name: issuer, type: String}           # iss
      - {name: sub, type: String}              # wire sub
      - {name: audience, type: String}         # aud
      - {name: issued_at, type: Integer}       # iat
      - {name: not_before, type: Integer}      # nbf
      - {name: expires_at, type: Integer}      # exp
      - {name: token_id, type: String}         # jti
      - {name: actor_subject, type: String}    # act.sub
      - {name: scope, type: String}
      - {name: principal_kind, type: String}
      - {name: tenant_id, type: String}
      - {name: email, type: Optional<String>}
      - {name: groups, type: List<String>}
    naming:
      wire: access-authority
      display: Access authority

  - name: identity.credentials.Sessions
    # Structural, not a read the code has: every state, for invariant checks.
    source: identity.credentials.Session
    consistency: read_your_writes
    fields:
      - {name: verifier_hash, type: identity.credentials.SessionVerifier}
      - {name: subject, type: String}
      - {name: tenant_id, type: String}
      - {name: idle_expires_at, type: Integer}
      - {name: absolute_expires_at, type: Integer}
      - {name: state, type: identity.credentials.Session.State}
    naming:
      wire: sessions
      display: Sessions (structural)

  - name: identity.credentials.AccessTokens
    # Structural, not a read the code has: every state, for invariant checks.
    source: identity.credentials.AccessToken
    consistency: read_your_writes
    fields:
      - {name: verifier_hash, type: identity.credentials.AccessTokenVerifier}
      - {name: sub, type: String}
      - {name: actor_subject, type: String}
      - {name: principal_kind, type: String}
      - {name: issued_at, type: Integer}
      - {name: not_before, type: Integer}
      - {name: expires_at, type: Integer}
      - {name: state, type: identity.credentials.AccessToken.State}
    naming:
      wire: access-tokens
      display: Access tokens (structural)
