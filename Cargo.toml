[package]
name = "identity"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace]
members = ["crates/identity-client"]
resolver = "2"

[features]
# A loopback-only development login that mints a session for a typed mailbox with no upstream
# identity provider. It is never a default feature, and `src/lib.rs` turns it into a compile error
# in any shipping profile: once when `debug_assertions` is off, and again — via the `optimized_build`
# cfg `build.rs` derives from `OPT_LEVEL` — whenever the profile optimizes, so that
# `RUSTFLAGS='-C debug-assertions=yes' cargo build --release` cannot sneak the route into an
# optimized artifact. `scripts/check-local-login-refused.sh` proves both refusals.
local-login = []

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["form", "json", "query", "tokio"] }
base64 = "0.22"
getrandom = "0.3"
nix = { version = "0.30", features = ["user"] }
openidconnect = "4.0.1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tokio-postgres = "0.7"
tokio-postgres-rustls = { version = "0.14", features = ["ring", "webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
zeroize = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
